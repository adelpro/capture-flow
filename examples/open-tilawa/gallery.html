<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تلاوة — لقطات المتجر</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071b17;
        --panel: #0c2a24;
        --ink: #fbf5e6;
        --soft: #9fc4b8;
        --gold: #e9c98b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 20px 64px;
        background: radial-gradient(circle at 50% 10%, #123f36 0, var(--bg) 60%);
        color: var(--ink);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 1200px; margin: 0 auto; }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); }
      p.lead { margin: 8px 0 36px; color: var(--soft); }
      h2 { margin: 42px 0 14px; font-size: 18px; color: var(--gold); font-weight: 600; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
      @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }
      figure { margin: 0; }
      a.shot { display: block; border-radius: 16px; overflow: hidden; background: var(--panel); box-shadow: 0 16px 34px #0008; }
      a.shot img { display: block; width: 100%; height: auto; }
      figcaption { margin-top: 8px; color: var(--soft); font-size: 13px; }
      .sheet { display: block; max-width: 100%; border-radius: 18px; box-shadow: 0 20px 50px #0009; }
      a { color: var(--gold); }
    </style>
  </head>
